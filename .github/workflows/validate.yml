name: Validate contracts, backend, web-admin and Android
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  web-admin:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web syntax, help sync, state tests and Markdown link integrity
        run: |
          node --check web-admin/app.js
          node --check web-admin/domain.js
          node --check web-admin/help.js
          node scripts/export-admin-help.mjs --check
          node --test web-admin/tests/*.test.js
          python3 scripts/check_markdown_links.py
  knowledge-contracts:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/knowledge-contracts.yml
  backend:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - name: Dedicated synthetic Mongo (never Atlas)
        run: |
          docker run -d --name cogniva-test-mongo --memory=512m -p 127.0.0.1:27048:27017 mongo:7.0.41 --bind_ip_all --wiredTigerCacheSizeGB 0.25 --setParameter enableTestCommands=1
          for attempt in $(seq 1 30); do
            if docker exec cogniva-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs cogniva-test-mongo
          exit 1
      - name: Unit, router, durability, concurrency, auth and migration tests
        working-directory: backend-rust
        env:
          COGNIVA_TEST_MONGODB_URI: mongodb://127.0.0.1:27048/
        run: cargo test --locked -- --include-ignored --test-threads=1
      - name: Remove disposable Mongo
        if: always()
        run: |
          docker logs --tail 30 cogniva-test-mongo || true
          docker rm -f cogniva-test-mongo || true
  android:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: JVM contracts, lint and Paparazzi golden verification
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
          cp -r app/build/test-results/testDebugUnitTest app/build/unit-test-results
          ./gradlew :app:verifyPaparazziDebug --no-daemon --console=plain
          git diff --exit-code -- app/src/test/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            android-app/app/build/unit-test-results/
            android-app/app/build/test-results/
            android-app/app/build/paparazzi/failures/
          retention-days: 5
