name: Validate contracts and golden images
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - name: Dedicated synthetic Mongo (never Atlas)
        run: docker run -d --name cogniva-test-mongo -p 127.0.0.1:27048:27017 mongo:8.0 --setParameter enableTestCommands=1
      - name: Router, durability, concurrency, domain and measured APK metadata
        working-directory: backend-rust
        env:
          COGNIVA_TEST_MONGODB_URI: mongodb://127.0.0.1:27048/
        run: cargo test --locked -- --include-ignored
      - name: Remove disposable Mongo
        if: always()
        run: docker rm -f cogniva-test-mongo
  android:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM contracts and real question preview matrix
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
          ./gradlew :app:verifyPaparazziDebug --tests br.com.concursoprep.app.QuestionPreviewMatrixScreenshotTest --no-daemon --console=plain
          git diff --exit-code -- app/src/test/snapshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-validation-failure
          path: |
            android-app/app/build/test-results/
            android-app/app/build/paparazzi/failures/
          retention-days: 5
