name: Gated build and atomic DigitalOcean promotion
on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promote after all gates pass
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: cogniva-production
  cancel-in-progress: false
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/validate.yml
  emulator:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/emulator-insets.yml
  build:
    needs: [verify, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build release client (no debug signing)
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Private release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$RELEASE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cogniva.p12"
          mkdir -p release-bundle
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --out release-bundle/cogniva.apk --ks "$RUNNER_TEMP/cogniva.p12" --ks-key-alias cogniva --ks-pass env:RELEASE_PASSWORD android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs release-bundle/cogniva.apk > release-bundle/signature.txt
          "$signer" verify --min-sdk-version 28 --max-sdk-version 35 release-bundle/cogniva.apk
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-bundle/cogniva.apk | grep -q application-debuggable; then exit 1; fi
          cp android-app/app/build/outputs/apk/release/output-metadata.json release-bundle/
          rm -f "$RUNNER_TEMP/cogniva.p12"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Rust runtime outside the VPS
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend-rust/Dockerfile
          load: true
          tags: ghcr.io/danielcdes-create/api-rust-core:sha-${{ github.sha }}
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Enforce runtime size and publish immutable image
        id: image
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="ghcr.io/danielcdes-create/api-rust-core:sha-$REVISION"
          size=$(docker image inspect "$tag" --format '{{.Size}}')
          test "$size" -lt 50000000
          docker push "$tag"
          reference=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          python3 scripts/package-release.py release-bundle --image "$reference" --revision "$REVISION"
          cp deploy/promote.py release-bundle/
          cp deploy/stage_bundle.py release-bundle/
          cp scripts/cleanup-registry.py release-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: cogniva-release-${{ github.sha }}
          path: release-bundle/
          retention-days: 5
  promote:
    needs: build
    if: github.event_name == 'push' || inputs.promote
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      packages: write
      # Version deletion is limited to this repository's associated package.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cogniva-release-${{ github.sha }}
          path: release-bundle
      - name: Install trusted SSH credentials
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Stage versioned bundle and promote only Cogniva
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          REVISION: ${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          target="$DO_USER@$DO_HOST"
          incoming="/opt/apps/cogniva-incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p $incoming"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes release-bundle/* "$target:$incoming/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "python3 $incoming/stage_bundle.py"
          printf '%s' "$REGISTRY_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "install -d -m 700 /run/cogniva-registry-$REVISION; docker --config /run/cogniva-registry-$REVISION login ghcr.io -u $REGISTRY_USER --password-stdin"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "DOCKER_CONFIG=/run/cogniva-registry-$REVISION python3 /opt/apps/cogniva-releases/$REVISION/promote.py /opt/apps/cogniva-releases/$REVISION --exercise-rollback"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "trap 'rm -f /run/cogniva-registry-$REVISION/config.json; rmdir /run/cogniva-registry-$REVISION' EXIT; DOCKER_CONFIG=/run/cogniva-registry-$REVISION python3 /opt/apps/cogniva-releases/$REVISION/promote.py /opt/apps/cogniva-releases/$REVISION"
      - name: Keep registry within the free storage budget
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DO_USER@$DO_HOST" 'cat /opt/apps/cogniva-current-release.json' > current-release.json
          python3 release-bundle/cleanup-registry.py current-release.json
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
