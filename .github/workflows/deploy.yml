name: CI/CD - Build & Deploy to DigitalOcean (Free Tier Optimized)

on:
  # Opção 1: Permite disparar manualmente pelo botão "Run workflow" no GitHub
  workflow_dispatch:

  # Opção 2: Dispara automaticamente apenas ao enviar uma Tag de versão (ex: v1.0.0)
  push:
    tags:
      - 'v*'
    # Caso queira disparar em todo push na main (exceto quando usar [skip ci]), descomente a linha abaixo:
    # branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  SERVICE_NAME: api-rust-core # Nome exato do serviço em /opt/apps/docker-compose.yml

jobs:
  build-and-deploy:
    # Ignora a execução se a mensagem do commit contiver [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Normalizar nome da imagem para minúsculas (exigência GHCR)
        id: vars
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=${REGISTRY}/${OWNER_LC}/${SERVICE_NAME}:latest" >> $GITHUB_OUTPUT

      - name: 3. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Build e Push da Imagem Rust (Multi-Stage < 50MB + Cache de Camadas GHA)
        uses: docker/build-push-action@v5
        with:
          context: ./backend-rust
          file: ./backend-rust/Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Configurar JDK 21 (para Build Automatizado do APK OTA)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 7. Compilar APK Android (COGNIVA OTA) e calcular metadados
        working-directory: ./android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp app/build/outputs/apk/debug/output-metadata.json dist/output-metadata.json

      - name: 8. Publicar APK OTA Automaticamente no Droplet (/opt/apps/apk) via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "android-app/dist/app-debug.apk,android-app/dist/output-metadata.json"
          target: "/opt/apps/apk"
          strip_components: 2

      - name: 9. Deploy Automatizado do Container no Droplet via SSH (Zero Build na VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            mkdir -p /opt/apps/apk
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/apps
            docker compose pull ${{ env.SERVICE_NAME }}
            docker compose up -d --no-deps ${{ env.SERVICE_NAME }}
            docker image prune -f
