# Installed at /etc/nginx/sites-available/cogniva by bootstrap-ip-tls.sh (__PUBLIC_HOST__ substituted).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __PUBLIC_HOST__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cogniva-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://__PUBLIC_HOST__$request_uri;
    }
}

server {
    # Tailscale Serve binds its own interface on 443; bind only verified certificate IP/host.
    # IPv6 :443 is enabled by bootstrap-ip-tls.sh ONLY when the certificate SAN covers COGNIVA_PUBLIC_IPV6.
    listen __PUBLIC_IPV4__:443 ssl default_server;
    # __IPV6_SSL_LISTEN__
    server_name __PUBLIC_HOST__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cogniva-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cogniva-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CognivaSSL:2m;
    ssl_session_timeout 1h;

    include /etc/nginx/cogniva-gate.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;
    limit_req_status 429;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/v1/auth/(login|register|guest|logout|web-logout)$ {
        if ($cogniva_maintenance = 1) { return 503; }
        limit_req zone=cogniva_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    location ~ ^/api/v1/(questions/[^/]+/ai/|admin/questions/import/assist$|admin/classification/proposals$) {
        if ($cogniva_maintenance = 1) { return 503; }
        limit_req zone=cogniva_ai burst=8 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    location = /api/v1/apk/download {
        if ($cogniva_maintenance = 1) { return 503; }
        limit_req zone=cogniva_apk burst=3 nodelay;
        gzip off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8001;
    }

    location = /api/v1/health {
        limit_req zone=cogniva_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    location /api/ {
        if ($cogniva_maintenance = 1) { return 503; }
        limit_req zone=cogniva_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        if ($cogniva_maintenance = 1) { return 503; }
        limit_req zone=cogniva_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        return 404;
    }
}
