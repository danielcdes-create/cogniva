server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 198.199.65.103 _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cogniva-acme;
        try_files $uri =404;
    }
    location / { return 308 https://198.199.65.103$request_uri; }
}
server {
    # Tailscale Serve already binds its own address on 443. Keep that listener.
    listen 198.199.65.103:443 ssl default_server;
    listen [2604:a880:400:d1:0:5:4ed1:a001]:443 ssl default_server;
    server_name 198.199.65.103 _;
    ssl_certificate /etc/letsencrypt/live/cogniva-ip/fullchain.pem;
    include /etc/nginx/cogniva-gate.conf;
    ssl_certificate_key /etc/letsencrypt/live/cogniva-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CognivaSSL:1m;
    ssl_session_timeout 1h;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 2m;
    limit_req_status 429;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location ~ ^/api/v1/auth/(native-session|telegram-link)$ {
        if ($cogniva_maintenance = 1) { return 503; }
        limit_req zone=cogniva_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
    location ~ ^/api/v1/questions/[^/]+/ai/ {
        if ($cogniva_maintenance = 1) { return 503; }
        limit_req zone=cogniva_ai burst=8 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
    location /api/ {
        if ($cogniva_maintenance = 1) { return 503; }
        limit_req zone=cogniva_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
    location = /api/v1/health { proxy_pass http://127.0.0.1:8001; }
    location = /apk { proxy_pass http://127.0.0.1:8001; }
    location = /cogniva.apk { proxy_pass http://127.0.0.1:8001; }
    location / { return 404; }
}
