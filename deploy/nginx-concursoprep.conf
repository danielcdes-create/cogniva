# Configuração Nginx para o Droplet DigitalOcean (/etc/nginx/sites-available/concursoprep)
# Encaminha tráfego externo do App Android Kotlin para o container stateless api-rust-core em 127.0.0.1:8001
server {
    listen 80;
    server_name _; # Substitua pelo seu domínio (ex: api.seudominio.com) se usar Certbot/Let's Encrypt

    # Compressão leve e timeouts para chamadas LLM (Gemini / OpenAI)
    client_max_body_size 5M;
    proxy_read_timeout 60s;
    proxy_connect_timeout 15s;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
