# Configuração Nginx para o Droplet DigitalOcean (/etc/nginx/sites-available/cogniva)
# Encaminha tráfego externo do App Android Kotlin e pacotes OTA APK para o container api-rust-core em 127.0.0.1:8001
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 15s;

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apk {
        proxy_pass http://127.0.0.1:8001/apk;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /cogniva.apk {
        proxy_pass http://127.0.0.1:8001/cogniva.apk;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
