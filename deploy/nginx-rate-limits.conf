# http context; installed as /etc/nginx/conf.d/cogniva-rate-limits.conf
# Normalize IPv6 clients to their /64 prefix (first 8 raw bytes of $binary_remote_addr,
# which is 16 bytes for IPv6 and 4 bytes for IPv4) to prevent /128 address rotation bypasses.
map $binary_remote_addr $cogniva_limit_key {
    "~^(?P<ipv6_subnet>.{8})" $ipv6_subnet;
    default                   $binary_remote_addr;
}

map $request_method $cogniva_ai_limit_key {
    GET     "";
    HEAD    "";
    default $cogniva_limit_key;
}

# IMPORTANT: Nginx SIGHUP (`systemctl reload nginx`) rejects changing the key variable or size
# of an existing shared-memory zone name in-place. Always keep legacy `cogniva_ai` bound to
# `$cogniva_limit_key` and allocate a versioned zone name (`cogniva_ai_mut`) when changing keys.
limit_req_zone $cogniva_limit_key zone=cogniva_auth:4m rate=15r/m;
limit_req_zone $cogniva_limit_key zone=cogniva_apk:4m rate=6r/m;
limit_req_zone $cogniva_limit_key zone=cogniva_ai:4m rate=2r/s;
limit_req_zone $cogniva_ai_limit_key zone=cogniva_ai_mut:4m rate=2r/s;
limit_req_zone $cogniva_limit_key zone=cogniva_api:4m rate=25r/s;
limit_req_zone $cogniva_limit_key zone=cogniva_media:4m rate=60r/s;
