# http context; installed as /etc/nginx/conf.d/cogniva-rate-limits.conf
limit_req_zone $binary_remote_addr zone=cogniva_auth:1m rate=15r/m;
limit_req_zone $binary_remote_addr zone=cogniva_apk:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=cogniva_ai:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=cogniva_api:1m rate=25r/s;
