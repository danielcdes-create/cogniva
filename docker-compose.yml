# Standalone Cogniva Compose reference.
# IMPORTANT: On the shared VPS, DO NOT replace /opt/apps/docker-compose.yml;
# deploy/promote.py updates only the target service override inside project "apps".
services:
  cogniva-api:
    image: ${COGNIVA_IMAGE:?Set an immutable ghcr.io/danielcdes-create/cogniva-api@sha256 digest}
    container_name: cogniva-api
    restart: unless-stopped
    env_file: .env
    ports: ['127.0.0.1:8001:8000']
    volumes: ['./apk:/app/apk:ro']
    read_only: true
    tmpfs: ['/tmp:size=16m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 192m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
