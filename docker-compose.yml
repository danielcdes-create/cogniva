# Standalone Cogniva example. DO NOT replace the shared /opt/apps/docker-compose.yml.
# Production promotion uses a per-service override against the existing apps project.
services:
  api-rust-core:
    image: ${COGNIVA_IMAGE:?Set an immutable ghcr.io image@sha256 digest}
    container_name: api-rust-core
    restart: unless-stopped
    env_file: .env.rust
    ports: ['127.0.0.1:8001:8000']
    volumes: ['./apk:/app/apk:ro']
    read_only: true
    tmpfs: ['/tmp:size=16m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    mem_limit: 160m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
